name: Run Result Downloader

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Board Result URL'
        required: true
        default: ''
        type: string
      session:
        description: 'Select Session / Exam'
        required: true
        type: choice
        options:
          - 'None'
          - 'Supplementary 2026'
          - 'Annual 2026'
          - 'Supplementary 2025'
          - 'Annual 2025'
          - 'Supplementary 2024'
          - 'Annual 2024'
          - 'Supplementary 2023'
          - 'Annual 2023'
          - 'Supplementary 2022'
          - 'Annual 2022'
          - 'Supplementary 2021'
          - 'Annual 2021'
      start_roll:
        description: 'Start Roll Number'
        required: true
        default: ''
        type: string
      end_roll:
        description: 'End Roll Number'
        required: true
        default: ''
        type: string
      merge_pdfs:
        description: 'Merge all PDFs into a single file?'
        required: true
        type: choice
        default: 'Yes (Merge into one file)'
        options:
          - 'Yes (Merge into one file)'
          - 'No (Keep separate only)'

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Playwright Browser (Chromium only)
      run: playwright install chromium

    - name: Run main script with inputs
      env:
        TARGET_URL: ${{ github.event.inputs.target_url }}
        SESSION: ${{ github.event.inputs.session }}
        START_ROLL: ${{ github.event.inputs.start_roll }}
        END_ROLL: ${{ github.event.inputs.end_roll }}
        MERGE_PDFS: ${{ github.event.inputs.merge_pdfs }}
      run: python app.py

    - name: Upload Results Folder
      uses: actions/upload-artifact@v4
      with:
        name: downloaded-results
        path: /tmp/bise_results/
