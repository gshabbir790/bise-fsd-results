name: Run Result Downloader

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Board Result URL'
        required: true
        default: 'https://www.bisefgd.edu.pk/result'
        type: string
      session:
        description: 'Session / Exam (e.g. Annual 2026)'
        required: false
        default: 'Annual 2026'
        type: string
      start_roll:
        description: 'Start Roll Number'
        required: true
        default: '100001'
        type: string
      end_roll:
        description: 'End Roll Number'
        required: true
        default: '100005'
        type: string

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Playwright Browser (Chromium only)
      run: playwright install chromium

    - name: Run main script with inputs
      env:
        TARGET_URL: ${{ github.event.inputs.target_url }}
        SESSION: ${{ github.event.inputs.session }}
        START_ROLL: ${{ github.event.inputs.start_roll }}
        END_ROLL: ${{ github.event.inputs.end_roll }}
      run: python app.py

    - name: Upload Results Folder
      uses: actions/upload-artifact@v4
      with:
        name: downloaded-results
        path: /tmp/bise_results/
